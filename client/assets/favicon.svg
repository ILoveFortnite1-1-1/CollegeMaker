<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#grad)"/>
  
  <!-- Graduation Cap / College Landmark Icon -->
  <g filter="url(#shadow)">
    <!-- Cap Top Diamond -->
    <polygon points="32,14 54,25 32,36 10,25" fill="#ffffff"/>
    <!-- Cap Skull Base -->
    <path d="M18,29.5 L18,42 C18,47 24,51 32,51 C40,51 46,47 46,42 L46,29.5 L32,36.5 Z" fill="#ffffff" opacity="0.92"/>
    <!-- Tassel -->
    <path d="M48,26.5 L48,39 C48,41 45.5,43 45.5,43" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="45.5" cy="44" r="2" fill="#fb923c"/>
  </g>
</svg>
